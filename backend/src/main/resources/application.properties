spring.application.name=portfolio-contact
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
# Reject oversized request bodies (Tomcat form/post limit; JSON bodies are also capped by RequestSizeFilter)
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=64KB


# --- MySQL ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


# --- SMTP (all from environment; never commit real values) ---
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:}
app.mail.owner=${OWNER_EMAIL:}

# --- CORS (comma-separated exact origins) ---
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

# --- Abuse protection (in-memory, per client IP) ---
app.rate-limit.max-requests=${RATE_LIMIT_MAX:5}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:600}
app.request.max-bytes=${MAX_REQUEST_BYTES:16384}

logging.level.root=INFO
